plugins { id 'com.android.application'; id 'com.chaquo.python' }
android {
    namespace 'com.crypticnotes.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.crypticnotes.mobile'
        minSdk 26
        targetSdk 35
        versionCode 21
        versionName '0.6.13-preview'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets { main { assets.srcDir '../generated/assets' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
chaquopy {
    defaultConfig {
        version '3.10'
        buildPython "${rootDir}/../out/android-tools/python310-full/python.exe"
        pip { install 'numpy==1.23.3'; install 'scipy==1.8.1'; install 'opencv-python==4.5.1.48' }
        extractPackages 'mapmatching', 'mobile_templates'
    }
    sourceSets { main { srcDir '../generated/python' } }
}
