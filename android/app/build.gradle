plugins { id 'com.android.application'; id 'com.chaquo.python' }
def signingFile = new File(System.getenv('JYSJ_ANDROID_SIGNING_CONFIG') ?: "${System.getenv('USERPROFILE')}/.jysj-signing/android-signing.json")
if (!signingFile.isFile()) throw new GradleException('Android signing configuration missing; refusing to generate a replacement key')
def signingData = new groovy.json.JsonSlurper().parseText(signingFile.getText('UTF-8').replace('\uFEFF',''))
if (!new File(signingData.keystore).isFile()) throw new GradleException('Android signing key missing; restore the original backup before building')
android {
    namespace 'com.crypticnotes.mobile'
    compileSdk 35
    buildFeatures { buildConfig true }
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.crypticnotes.mobile.v2'
        minSdk 26
        targetSdk 35
        versionCode 54
        versionName '0.6.46-preview'
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        debug {
            storeFile file(signingData.keystore)
            storePassword signingData.storePassword
            keyAlias signingData.alias
            keyPassword signingData.keyPassword
        }
    }
    sourceSets { main { assets.srcDir '../generated/assets' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
chaquopy {
    defaultConfig {
        version '3.10'
        buildPython (System.getenv("JYSJ_BUILD_PYTHON") ?: "${rootDir}/../out/android-tools/python310-full/python.exe")
        pip { install 'numpy==1.23.3'; install 'scipy==1.8.1'; install 'opencv-python==4.5.1.48' }
        extractPackages 'mapmatching', 'mobile_templates'
    }
    sourceSets { main { srcDir '../generated/python' } }
}
