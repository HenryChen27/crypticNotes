name: macOS application build
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build application
        run: python scripts/build_macos.py
        env:
          MACOS_ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: IdentityVMapAssistant-macOS-${{ matrix.arch }}
          path: |
            release/IdentityVMapAssistant-macOS-${{ matrix.arch }}.zip
            release/macos-${{ matrix.arch }}-SHA256SUMS.txt
          if-no-files-found: error
